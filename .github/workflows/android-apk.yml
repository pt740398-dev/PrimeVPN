name: Build Prime VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate or Extract Android Project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle project not found. Searching ZIP files..."

            mkdir -p "$GITHUB_WORKSPACE/.primevpn-source"

            while IFS= read -r ZIP_FILE; do
              echo "Extracting: $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/.primevpn-source"
            done < <(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname "*.zip" \
              -not -path "*/.git/*")

            PROJECT_FILE=$(find "$GITHUB_WORKSPACE/.primevpn-source" \
              -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No Gradle project found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Found Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Prime VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-VPN-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
