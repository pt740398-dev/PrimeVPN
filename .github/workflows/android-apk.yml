
name: Prime VPN APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Prime VPN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed

      - name: Locate Gradle Project
        id: locate
        shell: bash
        run: |
          FILE=$(find . -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle project not found."
            find . -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            find . -type f -name "*.apk"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Prime VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-VPN-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
